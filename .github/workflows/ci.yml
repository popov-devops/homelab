name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  ansible:
    name: Ansible lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Ansible and ansible-lint
        run: |
          python -m pip install --upgrade pip
          pip install ansible-core==2.21.4 ansible-lint==26.9.0

      - name: Install Ansible collections
        run: |
          ansible-galaxy collection install \
            -r ansible/requirements.yml \
            -p ~/.ansible/collections

      - name: Run ansible-lint
        run: |
          ansible-lint ansible/playbooks/site.yml

  terraform-validate:
    name: Terraform validation
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: terraform/proxmox

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.15.9"

      - name: Terraform format
        run: terraform fmt -check -recursive

      - name: Terraform init
        run: terraform init -backend=false

      - name: Terraform validate
        run: terraform validate

  terraform-plan:
    name: Terraform plan
    runs-on: ubuntu-latest
    needs:
      - terraform-validate

    defaults:
      run:
        working-directory: terraform/proxmox

    env:
      TF_VAR_proxmox_endpoint: ${{ secrets.PROXMOX_ENDPOINT }}
      TF_VAR_proxmox_api_token: ${{ secrets.PROXMOX_API_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.15.9"

      - name: Start SSH agent
        uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.PROXMOX_SSH_PRIVATE_KEY }}

      - name: Terraform init
        run: terraform init -backend=false

      - name: Terraform plan
        run: terraform plan -input=false -no-color
